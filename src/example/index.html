<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en" xml:lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Plugins -->
    <script type="importmap">
      {
        "imports": {
          "pc-lib": "./lib/spcd3.js"
        }
      }
    </script>
    <script type="module" src="./main.js"></script>

    <link rel="stylesheet" href="./reset.css" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./lib/spcd3.css" />
    <link rel="icon" type="image/svg+xml" href="./svg/spcd3-icon.svg" />
    <title>Steerable Parallel Coordinates</title>
  </head>

  <body>
    <header>
      <div class="page-header-row">
        <h1>Steerable Parallel Coordinates</h1>
        <div id="repolink">
          An Example of <a href="https://github.com/tugraz-isds/spcd3">SPCD3</a>
        </div>
      </div>
    </header>

    <div id="top-controls">
      <input type="file" id="fileInput" style="display: none" />
      <button class="input-button" id="input" title="Upload a CSV File">
        Upload File...
      </button>
      <button class="input-button" id="download" title="Download Plot as SVG">
        Download SVG...
      </button>
      <button
        class="input-button"
        id="resetRanges"
        title="Set Ranges from Data"
      >
        Set Ranges from Data
      </button>
      <button
        class="input-button"
        id="resetRoundedRanges"
        title="Set Ranges to Round Range"
      >
        Round Ranges from Data
      </button>
      <button
        class="input-button"
        id="resetAll"
        title="Reset Plot to Initial State"
      >
        Reset
      </button>
      <div class="slider-row">
        <div class="range-control" id="selectionSensitivityControl">
          <label for="selectionSensitivitySlider">Selection Sensitivity</label>
          <input
            type="range"
            id="selectionSensitivitySlider"
            min="0.1"
            max="1"
            step="0.1"
            value="0.4"
          />
          <output
            id="selectionSensitivityValue"
            for="selectionSensitivitySlider"
            >0.40 rem</output
          >
        </div>
        <div class="range-control" id="dimensionSpacingControl">
          <label for="dimensionSpacingSlider">Dimension Spacing</label>
          <input
            type="range"
            id="dimensionSpacingSlider"
            min="3"
            max="12"
            step="0.25"
            value="6"
          />
          <output id="dimensionSpacingValue" for="dimensionSpacingSlider"
            >6.00 rem</output
          >
        </div>
      </div>
    </div>

    <div id="spcd3-parallelcoords"></div>

    <div id="bottom-controls">
      <div id="hideDimensionContainer" class="item1"></div>
      <div id="invDimensionContainer" class="item2"></div>
      <div id="moDimensionContainer" class="item3"></div>
      <div id="filtDimensionContainer" class="item4"></div>
      <div id="ranDimensionContainer" class="item5"></div>
      <div id="selRecordsContainer" class="item6"></div>
    </div>
  </body>
</html>

name: publish

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-aarch64
            platform: macos-latest
            args: --target aarch64-apple-darwin

          - id: linux
            platform: ubuntu-22.04
            args: ""

          - id: windows
            platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: ${{ matrix.platform == 'ubuntu-22.04' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Enable Corepack
        run: corepack enable

      - name: Activate repository Yarn version
        run: corepack prepare yarn@4.17.1 --activate

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: yarn install --immutable

      - name: Build app
        run: yarn tauri build ${{ matrix.args }}

      - name: Upload macOS bundles
        if: ${{ matrix.platform == 'macos-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}
          path: |
            src-tauri/target/**/release/bundle/macos/*.app
            src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: warn

      - name: Upload Linux bundles
        if: ${{ matrix.platform == 'ubuntu-22.04' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}
          path: |
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
          if-no-files-found: warn

      - name: Upload Windows bundles
        if: ${{ matrix.platform == 'windows-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}
          path: |
            src-tauri/target/**/release/spcd3.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Show collected files
        run: find release-assets -type f | sort

      - name: Rename release assets
        run: |
          LIBNAME=$(node -p "require('./package.json').name.toLowerCase()")
          VERSION=$(node -p "require('./package.json').version")
          BASENAME="${LIBNAME}-v${VERSION}"
          mkdir -p release-assets/final

          find release-assets/macos-aarch64 -type f -name '*.dmg' -exec cp {} "release-assets/final/${BASENAME}-mac.dmg" \;
          find release-assets/macos-aarch64 -type d -name '*.app' -exec sh -c '
            app_path="$1"
            app_dir=$(dirname "$app_path")
            app_name=$(basename "$app_path")
            cd "$app_dir"
            zip -r "$OLDPWD/release-assets/final/${2}-mac.app.zip" "$app_name"
          ' sh {} "${BASENAME}" \;

          find release-assets/linux -type f -name '*.AppImage' -exec cp {} "release-assets/final/${BASENAME}-linux.AppImage" \;
          find release-assets/linux -type f -name '*.deb' -exec cp {} "release-assets/final/${BASENAME}-linux.deb" \;
          find release-assets/linux -type f -name '*.rpm' -exec cp {} "release-assets/final/${BASENAME}-linux.rpm" \;

          find release-assets/windows -type f -path '*/bundle/nsis/*.exe' -exec cp {} "release-assets/final/${BASENAME}-win-setup.exe" \;
          find release-assets/windows -type f -path '*/release/*.exe' ! -path '*/bundle/*' -exec cp {} "release-assets/final/${BASENAME}-win.exe" \;
          find release-assets/windows -type f -name '*.msi' -exec cp {} "release-assets/final/${BASENAME}-win.msi" \;

      - name: Show renamed files
        run: find release-assets/final -type f | sort

      - name: Create or update draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          TITLE="App v$VERSION"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes "See the assets to download this version and install." \
              --draft=true
          else
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes "See the assets to download this version and install." \
              --draft
          fi

      - name: Upload all assets to the draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          find release-assets/final -maxdepth 1 -type f -print0 | xargs -0 gh release upload "$TAG" --clobber
